# Rendered into TARGET/.specific/extensions.yml by setup-workflow.
# Only keys with at least one hook are written; empty lists are dropped.
apiVersion: agent-skills/v1
kind: Extensions
hooks:
  before_specify: []
  before_plan: []
  before_tasks: []
  before_implement: []
  before_clarify: []
  before_analyze: []
  before_review: []
  before_checklist: []
  before_constitution: []
  before_converge: []
  before_taskstoissues: []
  after_specify: []
  after_plan: []
  after_tasks: []
  # Default: run speckit-review automatically once implementation completes.
  after_implement:
    - extension: review
      command: speckit.review
      description: Review the implementation and refresh project context
      optional: false
      enabled: true
      condition: ""
  after_clarify: []
  # Default: run speckit-review automatically once analysis completes.
  after_analyze:
    - extension: review
      command: speckit.review
      description: Review the analysis and refresh project context
      optional: false
      enabled: true
      condition: ""
  after_review: []
  after_checklist: []
  after_constitution: []
  after_converge: []
  after_taskstoissues: []
